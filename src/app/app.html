<mat-toolbar>
  <a class="brand" routerLink="/products">CURIO LANE</a>
  <span class="spacer"></span>
  <a matButton="filled" routerLink="/my-orders">
    <mat-icon>receipt_long</mat-icon>
    My orders
  </a>
  <a matButton="filled" routerLink="/new-product">
    <mat-icon>add_box</mat-icon>
    New product
  </a>
  @if (isLoggedIn()) {
    <button matButton="filled" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  } @else {
    <a matButton="filled" routerLink="/login">
      <mat-icon>login</mat-icon>
      Login
    </a>
  }

</mat-toolbar>
<router-outlet />
