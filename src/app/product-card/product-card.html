<article class="card" [class.open]="open()" (mouseenter)="show()" (mouseleave)="close()">
  <button type="button" class="pic" (click)="show()" (focus)="show()"
          [attr.aria-label]="'Quick view: ' + product().name">
    <img [src]="image()" [alt]="product().name + ', pencil drawing'" width="400" height="400" loading="lazy" />
    @if (product().stockQuantity === 0) {
      <span class="sold">Sold out</span>
    }
  </button>

  <h3><a [routerLink]="['/products', product().id]">{{ product().name }}</a></h3>
  <p class="price">{{ product().price | currency: 'EUR' }}</p>

  <div class="pop" [style.left.px]="x()" [style.top.px]="y()" [style.width.px]="width()">
    <button type="button" class="close" (click)="close($event)" aria-label="Close">×</button>
    <img [src]="image()" alt="" width="400" height="400" />
    @if (product().category) {
      <p class="cat">{{ product().category }}</p>
    }
    <p class="name">{{ product().name }}</p>
    <p class="desc">{{ product().description }}</p>
    <div class="row">
      <span class="amount">{{ product().price | currency: 'EUR' }}</span>
      <a class="text-link" [routerLink]="['/products', product().id]">View details</a>
    </div>
  </div>
</article>
